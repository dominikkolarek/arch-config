monitor=,preferred,auto,1

input {
    kb_layout = jp,hr
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
    col.active_border = rgba(8ab88cff) rgba(a9cfaaff) 45deg
    col.inactive_border = rgba(3a5140ff)
}

decoration {
    rounding = 8

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        xray = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(00000055)
    }
}

animations {
   enabled = true
   animation = windows, 1, 3, default
   animation = fade, 1, 3, default
   animation = workspaces, 1, 3, default
}

misc {
     disable_hyprland_logo = true
}

$mod = SUPER

bind = $mod, Q, exec, kitty
bind = $mod, C, killactive,
bind = $mod, M, exit,
bind = $mod, E, exec, thunar
bind = $mod, R, exec, wofi --show drun
bind = $mod, V, exec, togglefloating,
bind = $mod, F, fullscreen
bind = $mod, A, exec, bluetoothctl connect CC:4B:04:59:47:CB

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop

bind = $mod, Tab, exec, ~/.config/rofi/window-switcher.sh
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-gnome-authentication-agent-1
exec-once = awww-daemon
exec-once = sleep 1 && awww img /home/dominik/Pictures/wallpapers/wall.png

exec-once = hyprpm reload -n
exec-once = hyprsunset

plugin {
    hyprbars {
        bar_height = 32
        bar_padding = 12
        bar_button_padding = 10
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(0f1610ee)
        col.text = rgba(8ab88cff)
        bar_text_size = 11
        bar_text_font = JetBrainsMono Nerd Font
        bar_text_align = left
        hyprbars-button = rgb(8ab88c), 22, 󰅖, hyprctl dispatch killactive
        hyprbars-button = rgb(8ab88c), 22, 󰊓, hyprctl dispatch fullscreen 1
    }
}
